[project]
name = "monitor-de-indicadores-banxico"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.115.0",
    "openai>=1.0.0",
    "pandas>=3.0.6",
    "pymongo>=4.18.2",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "poethepoet>=0.48.0",
]

[tool.poe.tasks]
backend = { shell = "printf '%s\\n' '' 'Backend: http://localhost:8000' 'API docs: http://localhost:8000/docs' '' && uvicorn backend.main:app --reload --port 8000" }
frontend = { shell = "printf '%s\\n' '' 'Frontend: http://localhost:8080' '' && npm --prefix frontend run dev -- --host 0.0.0.0 --port 8080" }
run = { parallel = ["backend", "frontend"] }
